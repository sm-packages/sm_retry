name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    # pub.dev requires the first version to be published manually.
    if: github.ref_name != 'v1.0.0'
    permissions:
      id-token: write
    uses: sm-packages/.github/.github/workflows/publish-pub-dev.yml@v1
